# Production nginx snippet for the Backd C2 dual-listener server.
# Cloudflare (orange cloud) terminates the public TLS session; nginx keeps
# TLS on the origin leg. Both server_names point at the same VPS.
#
#   client   : c2-client.example.com   -> 127.0.0.1:9909  (C2 clients)
#   operator : c2-operator.example.com  -> 127.0.0.1:9910  (human operators)
#
# IMPORTANT: 9909 is currently used by backd-wstunnel.service. If both must
# coexist, move the C2 client listener to 9911 (server config.json) and
# update the upstream below, or stop the old unit first.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backd_c2_client   { server 127.0.0.1:9909;  keepalive 32; }
upstream backd_c2_operator { server 127.0.0.1:9910;  keepalive 16; }

server {
    listen 443 ssl http2;
    server_name c2-client.example.com;

    ssl_certificate     /etc/letsencrypt/live/c2-client.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2-client.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:backd_c2_client:10m;

    client_max_body_size 16m;

    location /ws {
        proxy_pass http://backd_c2_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://backd_c2_client;
        access_log off;
    }

    location / { return 404; }
}

server {
    listen 443 ssl http2;
    server_name c2-operator.example.com;

    ssl_certificate     /etc/letsencrypt/live/c2-operator.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/c2-operator.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:backd_c2_operator:10m;

    client_max_body_size 16m;

    # Operator endpoint: restrict to known source addresses before exposing.
    # allow 203.0.113.10;
    # deny  all;

    location /ws {
        proxy_pass http://backd_c2_operator;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://backd_c2_operator;
        access_log off;
    }

    location / { return 404; }
}
